<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PXM Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
          Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f8fbff 0%, #eef4ff 100%);
        color: #212529;
      }

      main {
        width: min(92vw, 32rem);
        padding: 2rem;
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 1rem 2.5rem rgba(13, 110, 253, 0.12);
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
      }

      p {
        margin: 0.5rem 0 0;
        color: #495057;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>PXM sedang offline</h1>
      <p>Koneksi internet tidak tersedia saat ini.</p>
      <p>Buka kembali halaman setelah koneksi tersambung, atau gunakan data yang sudah tersimpan di cache browser.</p>
    </main>
  </body>
  </html>
